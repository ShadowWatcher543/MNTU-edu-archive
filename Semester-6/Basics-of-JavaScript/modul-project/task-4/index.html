<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List — Завдання 4</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a202c;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .todo-container {
            background-color: #2d3748;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 16px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            background-color: #1a202c;
            color: #e2e8f0;
            outline: none;
        }
        input:focus {
            border-color: #3182ce;
        }
        button {
            padding: 8px 16px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 10px;
            border-bottom: 1px solid #4a5568;
            transition: all 0.2s ease;
        }
        li:hover {
            background-color: #4a5568;
        }
    </style>
</head>
<body>

<div class="todo-container">
    <h1>Мій список завдань</h1>

    <div class="input-group">
        <input id="taskInput" placeholder="Нове завдання">
        <button id="addBtn">Додати</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script type="module" src="./src/index.ts"></script>
</body>
</html>
